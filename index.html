<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cookie Crumble Clicker</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(to bottom,#3b1d0f,#1a0e07);
color:white;
text-align:center;
overflow-x:hidden;
}

h1{margin-top:20px;}

#crumble{
font-size:90px;
cursor:pointer;
transition:transform 0.1s;
user-select:none;
}

#crumble:active{
transform:scale(0.9);
}

#stats{margin:20px;}

#xpContainer{
width:320px;
height:20px;
background:#333;
margin:10px auto;
border-radius:10px;
overflow:hidden;
}

#xpBar{
height:100%;
width:0%;
background:gold;
}

#upgrades{
margin-top:20px;
}

.button{
display:block;
margin:6px auto;
padding:8px 12px;
border:none;
border-radius:6px;
background:#6b3e1d;
color:white;
cursor:pointer;
}

.button:disabled{
background:#444;
cursor:not-allowed;
}

.particle{
position:fixed;
pointer-events:none;
font-weight:bold;
z-index:9999;
animation:floatUp 0.8s ease-out forwards;
}

@keyframes floatUp{
0%{opacity:1;transform:translateY(0);}
100%{opacity:0;transform:translateY(-80px);}
}

.cookieRain{
position:fixed;
top:-50px;
pointer-events:none;
animation:fall linear forwards;
}

@keyframes fall{
to{transform:translateY(110vh) rotate(360deg);}
}
</style>
</head>
<body>

<h1>🍪 Cookie Crumble Clicker 🍪</h1>

<div id="crumble">🍪</div>

<div id="stats">
<div>Crumbles: <span id="crumbCount">0</span></div>
<div>Level: <span id="playerLevel">1</span></div>
<div>XP: <span id="playerXP">0</span>/<span id="xpThreshold">100</span></div>

<div id="xpContainer">
<div id="xpBar"></div>
</div>
</div>

<h2>Upgrades</h2>
<div id="upgrades"></div>

<script>
document.addEventListener("DOMContentLoaded", function(){

// ================= VARIABLES =================
var crumbCount=0;
var clickPower=1;
var cps=0;
var playerXP=0;
var playerLevel=1;
var xpThreshold=100;

// ================= HELPERS =================
function formatNum(n){
if(n>=1e6)return (n/1e6).toFixed(1)+'M';
if(n>=1e3)return (n/1e3).toFixed(1)+'K';
return Math.floor(n);
}

function updateUI(){
document.getElementById("crumbCount").innerHTML=formatNum(crumbCount);
document.getElementById("playerXP").innerHTML=Math.floor(playerXP);
document.getElementById("playerLevel").innerHTML=playerLevel;
document.getElementById("xpThreshold").innerHTML=xpThreshold;
document.getElementById("xpBar").style.width=
(Math.min(playerXP/xpThreshold*100,100))+"%";
renderUpgrades();
}

function createParticle(x,y,text){
var p=document.createElement("div");
p.className="particle";
p.style.left=x+"px";
p.style.top=y+"px";
p.innerHTML=text;
document.body.appendChild(p);
setTimeout(function(){p.remove();},800);
}

function createCookieRain(){
var c=document.createElement("div");
c.className="cookieRain";
c.innerHTML="🍪";
c.style.left=Math.random()*window.innerWidth+"px";
c.style.fontSize=(20+Math.random()*30)+"px";
c.style.animationDuration=(3+Math.random()*2)+"s";
document.body.appendChild(c);
setTimeout(function(){c.remove();},5000);
}

// ================= UPGRADES =================
var upgrades=[
{name:"+1 Click",base:50,level:0,type:"click"},
{name:"+3 Click",base:250,level:0,type:"click3"},
{name:"+1 CPS",base:200,level:0,type:"cps"},
{name:"+5 CPS",base:1000,level:0,type:"cps5"}
];

function getCost(u){
return Math.floor(u.base*Math.pow(1.5,u.level));
}

function renderUpgrades(){
var container=document.getElementById("upgrades");
container.innerHTML="";

for(var i=0;i<upgrades.length;i++){
(function(){
var u=upgrades[i];
var cost=getCost(u);
var b=document.createElement("button");
b.className="button";
b.innerHTML=u.name+" Lv."+u.level+" - "+formatNum(cost);
b.disabled=crumbCount<cost;

b.onclick=function(){
if(crumbCount>=cost){
crumbCount-=cost;
u.level++;
if(u.type==="click") clickPower+=1;
if(u.type==="click3") clickPower+=3;
if(u.type==="cps") cps+=1;
if(u.type==="cps5") cps+=5;
updateUI();
}
};

container.appendChild(b);
})();
}
}

// ================= CLICK SYSTEM =================
var crumble=document.getElementById("crumble");

crumble.onclick=function(e){
var crit=Math.random()<0.1;
var amount=clickPower;
if(crit) amount*=5;

crumbCount+=amount;
playerXP+=amount;

createParticle(e.clientX,e.clientY,
crit?"💥 CRIT!":"+"+formatNum(amount));

while(playerXP>=xpThreshold){
playerXP-=xpThreshold;
playerLevel++;
xpThreshold=Math.floor(xpThreshold*1.4);
createParticle(window.innerWidth/2,100,"🎉 LEVEL UP!");
}

updateUI();
};

// ================= AUTO CPS =================
setInterval(function(){
crumbCount+=cps;
playerXP+=cps*0.5;

while(playerXP>=xpThreshold){
playerXP-=xpThreshold;
playerLevel++;
xpThreshold=Math.floor(xpThreshold*1.4);
}

updateUI();
},1000);

// ================= COOKIE RAIN =================
setInterval(function(){
if(Math.random()<0.4){
createCookieRain();
}
},700);

updateUI();

});
</script>

</body>
</html>
